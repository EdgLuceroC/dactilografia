name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar:
    name: Lint, pruebas y compilación
    runs-on: ubuntu-latest

    steps:
      - name: Traer el código
        uses: actions/checkout@v5

      - name: Preparar Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build
